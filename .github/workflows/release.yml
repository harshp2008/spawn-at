name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Package Binary
        run: |
          mkdir -p staging
          cp target/release/spawn-at staging/
          cp README.md LICENSE staging/
          tar -czf spawn-at-x86_64-unknown-linux-gnu.tar.gz -C staging .
          # install.sh extracts into a temp dir and requires ./spawn-at there.
          tar -tzf spawn-at-x86_64-unknown-linux-gnu.tar.gz | tee /dev/stderr | grep -qx './spawn-at'

      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: spawn-at-x86_64-unknown-linux-gnu.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
