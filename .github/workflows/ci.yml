name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Format
        run: cargo fmt --check

      # spawn-at-verify is not a default member; its features are named so its
      # tui and fixture code is linted too.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features spawn-at-verify/tui,spawn-at-verify/fixture -- -D warnings

      - name: Test spawn-at, spawn-at-core, xtask
        run: cargo test --locked -p spawn-at -p spawn-at-core -p xtask

      # The 4 ignored fixture_test cases need a live display and stay ignored.
      - name: Test spawn-at-verify
        run: cargo test --locked -p spawn-at-verify --features tui,fixture

      - name: Test GNOME extension (node)
        run: node --test tests/*.js

  # Other operating systems are not supported yet; this only keeps the whole workspace compiling
  # there. Linux-only crates (zbus, x11rb) are not in their dependency tree. `cargo check` does not
  # link, so the Ubuntu runner is enough. Tests are not built off Linux. spawn-at-verify is an
  # empty crate off unix; with its `fixture` feature it also needs unix, so on Windows it is
  # checked without features.
  check-other-os:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check Windows (compile only, whole workspace)
        run: cargo check --locked --workspace --target x86_64-pc-windows-gnu
      - name: Check macOS Intel (compile only, whole workspace)
        run: cargo check --locked --workspace --target x86_64-apple-darwin --features spawn-at-verify/tui,spawn-at-verify/fixture
      - name: Check macOS Apple silicon (compile only, whole workspace)
        run: cargo check --locked --workspace --target aarch64-apple-darwin --features spawn-at-verify/tui,spawn-at-verify/fixture
      - name: Linux-only crates are not pulled in off Linux
        run: |
          for t in x86_64-pc-windows-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            if cargo tree --locked -p spawn-at --target "$t" -e normal,build | grep -E ' (zbus|x11rb) v'; then
              echo "zbus or x11rb is in the dependency tree for $t" >&2
              exit 1
            fi
          done
