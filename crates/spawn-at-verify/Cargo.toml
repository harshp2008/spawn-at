[package]
name = "spawn-at-verify"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.6"
regex = "1.10"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }

[dev-dependencies]
spawn-at-core = { path = "../spawn-at-core" }
