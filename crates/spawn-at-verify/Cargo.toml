[package]
name = "spawn-at-verify"
version = "0.2.0-beta.2"
edition = "2021"
publish = false
default-run = "spawn-at-verify"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.6"
regex = "1.10"
libc = "0.2"
winit = { version = "0.29", optional = true }
softbuffer = { version = "0.4", optional = true }
signal-hook = { version = "0.3", optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.28", optional = true }
unicode-width = { version = "0.2", optional = true }

[features]
default = []
fixture = ["dep:winit", "dep:softbuffer", "dep:signal-hook"]
tui = ["dep:ratatui", "dep:crossterm", "dep:signal-hook", "dep:unicode-width"]

[[bin]]
name = "spawn-at-verify"
path = "src/main.rs"

[[bin]]
name = "fixture"
path = "src/bin/fixture.rs"
required-features = ["fixture"]

[[test]]
name = "fixture_test"
path = "tests/fixture_test.rs"
required-features = ["fixture"]

[[test]]
name = "oracle_cross_check"
path = "tests/oracle_cross_check.rs"

[[test]]
name = "trace_analyser_test"
path = "tests/trace_analyser_test.rs"

[[test]]
name = "trace_state_test"
path = "tests/trace_state_test.rs"

[[test]]
name = "tui_test"
path = "tests/tui_test.rs"
required-features = ["tui"]

[[test]]
name = "render_test"
path = "tests/render_test.rs"
required-features = ["tui"]


[dev-dependencies]
spawn-at-core = { path = "../spawn-at-core" }
