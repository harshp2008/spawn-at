[package]
name = "spawn-at-core"
version = "0.2.0-beta.1"
edition = "2021"
description = "Pure mathematical geometry and declarative scheduling primitives for spawn-at"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.6"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"], optional = true }

[features]
default = ["clap"]
clap = ["dep:clap"]

[dev-dependencies]
serde_json = "1.0"
