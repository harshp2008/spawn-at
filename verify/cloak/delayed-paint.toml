id = "cloak/delayed-paint"
title = "Zero-flicker cold-start with delayed first paint matrix"
description = "Tests window cold-start masking across a matrix of initial buffer presentation delays (0, 50, 150, 500 ms). Validates that the window is cloaked before map and never visible at off-target geometry."
kind = "both"
required = true
tags = ["visual", "needs-fixture"]

[matrix]
delay = [0, 50, 150, 500]

[requires]
session = ["wayland"]
backend = ["gnome"]
gnome = "42-48"
monitors_min = 1
scale = "any"
apps = []

[subject]
app = "fixture"
profile = "delayed-paint"
args = [
    "--title", "Verify-Cloak-DelayedPaint",
    "--app-id", "verify.cloak.delayedpaint",
    "--paint-delay-ms", "{delay}"
]

[action]
command = "spawn"
repeatable = false
args = [
    "--anchor", "center",
    "--size", "500", "350"
]

[expect]
exit_code = 0
stderr_absent = ["[spawn-at] ERROR:", "[spawn-at] WARNING:"]
stderr_present = []
diagnostics = []
never_visible_off_target = true

[expect.rect]
anchor = "center"
size = [500, 350]
margin = 16
tolerance_px = 1

[human]
watch = "Look closely at the screen center: the window must emerge already sized at 500x350 and positioned at center. There must be zero initial flicker, center-jump, or unstyled flash in the top-left or screen origin."
