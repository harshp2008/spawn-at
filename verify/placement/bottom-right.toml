id = "placement/bottom-right"
title = "Window placed in bottom-right corner"
description = "Spawns a test window anchored to the bottom-right corner of the work area with a 16px boundary margin."
kind = "both"
required = true
tags = ["visual", "needs-fixture"]

[requires]
session = ["any"]
backend = ["any"]
gnome = "any"
monitors_min = 1
scale = "any"
apps = []

[subject]
app = "fixture"
profile = "plain"
args = [
    "--title", "Verify-Placement-BottomRight",
    "--app-id", "verify.placement.bottomright",
    "--expect", "Should appear at bottom-right corner"
]

[action]
command = "spawn"
repeatable = false
args = [
    "--class", "verify.placement.bottomright",
    "--anchor", "bottom-right",
    "--size", "400", "300",
    "--margin", "16"
]

[expect]
exit_code = 0
stderr_absent = ["[spawn-at] ERROR:", "[spawn-at] WARNING:"]
stderr_present = []
diagnostics = []
never_visible_off_target = false

[expect.rect]
anchor = "bottom-right"
size = [400, 300]
margin = 16
tolerance_px = 1

[human]
watch = "Did the window appear once in the bottom-right corner with a small gap from screen edges, without flickering or jumping?"
