id = "placement/bottom-right-minsize-at-min"
category = "placement"
title = "Window requested exactly at its 300x200 minimum, bottom-right"
description = "The fixture enforces a 300x200 minimum and is asked for exactly 300x200 at the bottom-right corner with a 16px margin."
kind = "auto"
required = true
tags = ["visual", "needs-fixture", "resize"]

[requires]
session = ["any"]
backend = ["any"]
gnome = "any"
monitors_min = 1
scale = "any"
apps = []

[subject]
app = "fixture"
profile = "plain"
min_width = 300
min_height = 200
args = [
    "--title", "Verify-Placement-BottomRightMinsizeAtMin",
    "--app-id", "verify.placement.bottomrightminsizeatmin",
    "--expect", "Should be exactly 300x200 in the bottom-right corner"
]

[action]
command = "spawn"
repeatable = false
args = [
    "--class", "verify.placement.bottomrightminsizeatmin",
    "--anchor", "bottom-right",
    "--size", "300", "200",
    "--margin", "16"
]

[expect]
exit_code = 0
stderr_absent = ["[spawn-at] ERROR:", "[spawn-at] WARNING:"]
stderr_present = []
diagnostics = []
never_visible_off_target = false

[expect.rect]
anchor = "bottom-right"
size = [300, 200]
margin = 16
tolerance_px = 1

[human]
watch = "Did the window appear once at its minimum size in the bottom-right corner, without flickering or jumping?"
