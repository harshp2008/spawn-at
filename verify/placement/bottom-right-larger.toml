id = "placement/bottom-right-larger"
category = "placement"
title = "Larger 800x600 window in the bottom-right corner"
description = "Spawns the fixture (minimum 100x100, opens at 400x300) and asks for 800x600 at the bottom-right corner with a 16px margin: a real grow."
kind = "auto"
required = true
tags = ["visual", "needs-fixture", "resize"]

[requires]
session = ["any"]
backend = ["any"]
gnome = "any"
monitors_min = 1
scale = "any"
apps = []

[subject]
app = "fixture"
profile = "plain"
min_width = 100
min_height = 100
args = [
    "--title", "Verify-Placement-BottomRightLarger",
    "--app-id", "verify.placement.bottomrightlarger",
    "--expect", "Should grow to 800x600 in the bottom-right corner"
]

[action]
command = "spawn"
repeatable = false
args = [
    "--class", "verify.placement.bottomrightlarger",
    "--anchor", "bottom-right",
    "--size", "800", "600",
    "--margin", "16"
]

[expect]
exit_code = 0
stderr_absent = ["[spawn-at] ERROR:", "[spawn-at] WARNING:"]
stderr_present = []
diagnostics = []
never_visible_off_target = false

[expect.rect]
anchor = "bottom-right"
size = [800, 600]
margin = 16
tolerance_px = 1

[human]
watch = "Did the window appear once at the larger size in the bottom-right corner, 16px from the edges, without flickering or jumping?"
