id = "placement/top-right-below-min-both"
category = "placement"
title = "Request below the minimum on both axes (200x150 vs min 300x200), top-right"
description = "The fixture enforces a 300x200 minimum and is asked for 200x150 at the top-right anchor: it settles at 300x200 and must be placed for that size with a 16px margin."
kind = "auto"
required = true
tags = ["visual", "needs-fixture", "resize"]

[requires]
session = ["any"]
backend = ["any"]
gnome = "any"
monitors_min = 1
scale = "any"
apps = []

[subject]
app = "fixture"
profile = "plain"
min_width = 300
min_height = 200
args = [
    "--title", "Verify-Placement-TopRightBelowMinBoth",
    "--app-id", "verify.placement.toprightbelowminboth",
    "--expect", "Should be 300x200 at the top-right corner"
]

[action]
command = "spawn"
repeatable = false
args = [
    "--class", "verify.placement.toprightbelowminboth",
    "--anchor", "top-right",
    "--size", "200", "150",
    "--margin", "16"
]

[expect]
exit_code = 0
stderr_absent = ["[spawn-at] ERROR:", "[spawn-at] WARNING:"]
stderr_present = []
diagnostics = []
never_visible_off_target = false

[expect.rect]
anchor = "top-right"
size = [200, 150]
margin = 16
tolerance_px = 1

[human]
watch = "Did the window appear once at its minimum size at the top-right corner?"
