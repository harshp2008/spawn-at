id = "placement/bottom-right-below-min-width"
category = "placement"
title = "Request below the minimum width (200x300 vs min 300x200), bottom-right"
description = "The fixture enforces a 300x200 minimum and is asked for 200x300: the width is raised to 300, the final size is 300x300, and the window must sit in the bottom-right corner for that size."
kind = "auto"
required = true
tags = ["visual", "needs-fixture", "resize"]

[requires]
session = ["any"]
backend = ["any"]
gnome = "any"
monitors_min = 1
scale = "any"
apps = []

[subject]
app = "fixture"
profile = "plain"
min_width = 300
min_height = 200
args = [
    "--title", "Verify-Placement-BottomRightBelowMinWidth",
    "--app-id", "verify.placement.bottomrightbelowminwidth",
    "--expect", "Should be 300x300 in the bottom-right corner"
]

[action]
command = "spawn"
repeatable = false
args = [
    "--class", "verify.placement.bottomrightbelowminwidth",
    "--anchor", "bottom-right",
    "--size", "200", "300",
    "--margin", "16"
]

[expect]
exit_code = 0
stderr_absent = ["[spawn-at] ERROR:", "[spawn-at] WARNING:"]
stderr_present = []
diagnostics = []
never_visible_off_target = false

[expect.rect]
anchor = "bottom-right"
size = [200, 300]
margin = 16
tolerance_px = 1

[human]
watch = "Did the window appear once, 300 wide, in the bottom-right corner?"
