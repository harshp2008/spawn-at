id = "placement/bottom-right-far-below-min"
category = "placement"
title = "Request far below the minimum (50x50 vs min 300x200), bottom-right"
description = "The fixture enforces a 300x200 minimum and is asked for 50x50: it settles at 300x200 and must sit in the bottom-right corner for that size."
kind = "auto"
required = true
tags = ["visual", "needs-fixture", "resize"]

[requires]
session = ["any"]
backend = ["any"]
gnome = "any"
monitors_min = 1
scale = "any"
apps = []

[subject]
app = "fixture"
profile = "plain"
min_width = 300
min_height = 200
args = [
    "--title", "Verify-Placement-BottomRightFarBelowMin",
    "--app-id", "verify.placement.bottomrightfarbelowmin",
    "--expect", "Should be 300x200 in the bottom-right corner"
]

[action]
command = "spawn"
repeatable = false
args = [
    "--class", "verify.placement.bottomrightfarbelowmin",
    "--anchor", "bottom-right",
    "--size", "50", "50",
    "--margin", "16"
]

[expect]
exit_code = 0
stderr_absent = ["[spawn-at] ERROR:", "[spawn-at] WARNING:"]
stderr_present = []
diagnostics = []
never_visible_off_target = false

[expect.rect]
anchor = "bottom-right"
size = [50, 50]
margin = 16
tolerance_px = 1

[human]
watch = "Did the window appear once at its minimum size in the bottom-right corner?"
